name: Build

# Builds the FreeTunnel Qt client for Linux, macOS (arm64 + Intel) and Windows.
#
# The client is not self-contained: it links against the C++ VPN core from
# TrustTunnel/TrustTunnelClient (target `vpnlibs_trusttunnel`). The strategy is
# to check that repo out as `upstream/`, drop this repo into
# `upstream/FreeTunnel/`, then configure CMake from the upstream root so the
# upstream conan bootstrap runs and the `vpnlibs_trusttunnel` target exists.
#
# HTTP3/QUIC (quiche) is enabled, so the per-config HTTP/3 transport works in
# the shipped binaries. This pulls Rust into the core build (quiche is Rust).
#
# Release binaries are UNSIGNED (no code-signing certs). macOS .app is ad-hoc
# signed so it launches after the user approves it in Gatekeeper; see the README.

# The repo is public, so Actions on standard runners are free — run the full
# Mac/Win/Linux matrix on PRs and main for continuous validation, plus on
# release tags (which also publish artifacts) and manual dispatch.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: TrustTunnel/TrustTunnelClient
  # Pinned ref in scripts/upstream_ref.txt (verified by scripts/verify_upstream_patch.sh).
  # Exact pin: conan drives every native dependency fetch and build, so the
  # version must not float. This is the latest 2.x — i.e. what the previous
  # `conan~=2.12` range was actually resolving to; pinning to 2.12.x instead
  # would have silently downgraded CI by ~19 minor versions.
  CONAN_VER: '2.31.1'
  # Opt JS actions onto Node 24 (silences the Node 20 deprecation warning for
  # actions without a Node 24 release yet, e.g. ilammy/msvc-dev-cmd).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Least privilege by default: no job needs to write to the repo except the
# release job, which asks for contents: write explicitly. Without this the
# repo/org default applies, handing a write-capable token to every job —
# including the ones that execute third-party tooling.
permissions:
  contents: read

jobs:
  # Rasterize the bundle icons (.icns/.ico/.png) from the neutral logo.svg on
  # Linux (where rsvg/icnsutils/ImageMagick are reliable) and share them with
  # every platform build, so the dock/taskbar/Finder icons match the in-app
  # monochrome logo. REQUIRED: several outputs (icon.iconset for macOS,
  # installer-*.bmp for NSIS, logo-48/128/512.png for the .deb) are not
  # committed, so packaging cannot proceed without this artifact.
  icons:
    name: Render bundle icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install rasterizers
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin icnsutils imagemagick
      - name: Render icons from logo.svg
        run: bash scripts/render-icons.sh icons-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-icons
          path: icons-out/

  build:
    name: Build (${{ matrix.artifact }})
    needs: icons
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on ubuntu-22.04 (glibc 2.35) so the .deb runs on most
          # current distros (Ubuntu 22.04+, Debian 12+, recent Fedora). Qt and a
          # modern clang come from aqt/llvm.sh, not the distro's old packages.
          - os: ubuntu-22.04
            platform: linux
            qt_host: linux
            qt_arch: linux_gcc_64
            artifact: freetunnel-linux-x86_64
          # Universal macOS: built on the Apple-Silicon runner; the x86_64 slice
          # is cross-compiled (Apple clang) and lipo-merged, so no Intel runner
          # is needed. Qt comes from aqt (clang_64 is a universal build).
          - os: macos-15
            platform: macos
            qt_host: mac
            qt_arch: clang_64
            artifact: freetunnel-macos-universal
          - os: windows-latest
            platform: windows
            qt_host: windows
            qt_arch: win64_msvc2022_64
            artifact: freetunnel-windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: client

      # Drop the freshly-rendered icons over the committed ones before the
      # client is injected into the upstream tree. Must succeed: packaging
      # needs files that only exist in this artifact (see the icons job) —
      # a swallowed failure here used to resurface minutes later as a cryptic
      # NSIS/iconutil/cp error.
      - name: Use rendered bundle icons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bundle-icons
          path: client/assets

      - name: Build macOS .icns with iconutil
        if: matrix.platform == 'macos'
        run: iconutil -c icns client/assets/icon.iconset -o client/assets/logo.icns

      - name: Read pinned upstream ref
        id: upstream_ref
        shell: bash
        run: |
          set -eu
          ref="$(tr -d '[:space:]' < client/scripts/upstream_ref.txt)"
          # Only the security workflow asserted this shape, so a corrupted file
          # (or a branch name) would build a MUTABLE ref with the build staying
          # green. Check it where it is actually used.
          case "$ref" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "upstream_ref.txt is not a 40-hex commit SHA: '$ref'" >&2; exit 1 ;;
          esac
          echo "value=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream core (${{ env.UPSTREAM_REPO }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.upstream_ref.outputs.value }}
          path: upstream
          # Full history + tags so `git describe --tags` can resolve the core to
          # a version tag (not just the short commit) for the About footer.
          fetch-depth: 0
          fetch-tags: true

      - name: Inject client into upstream tree
        shell: bash
        run: |
          set -eux
          rm -rf upstream/FreeTunnel
          mkdir -p upstream/FreeTunnel
          (cd client && tar --exclude='./.git' -cf - .) | (cd upstream/FreeTunnel && tar -xf -)
          {
            printf '\n# --- injected by FreeTunnel CI ---\n'
            printf 'if (BUILD_TRUSTTUNNEL_QT AND EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/FreeTunnel/CMakeLists.txt")\n'
            printf '    add_subdirectory(FreeTunnel)\n'
            printf 'endif ()\n'
          } >> upstream/CMakeLists.txt
          test -f upstream/conanfile.py
          test -f upstream/requirements.txt

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Patch core wrapper (surface tunnel stats)
        shell: bash
        run: patch -p1 -d upstream < client/vendor/trusttunnel/tunnel-stats-handler.patch

      # quiche (HTTP/3) is built from Rust by conan; ensure a toolchain exists on
      # every runner (macOS/Windows ship one, but install to be safe + on PATH).
      # Pinned action instead of `curl https://sh.rustup.rs | sh`: this toolchain
      # compiles quiche into the shipped binary, and a piped installer script is
      # an unpinnable remote dependency in the job that publishes releases.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      # ---------------------------------------------------------------- Linux
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # Modern clang (the core is clang-only; 22.04's default clang is too old).
          # The installer is vendored in this repo rather than fetched from
          # apt.llvm.org: it runs AS ROOT in the job that produces the release
          # binaries, so what it does has to be reviewable in a diff, not whatever
          # upstream is serving today. It is 8 KB of shell — refresh it by opening
          # a PR against scripts/llvm.sh.
          sudo bash client/scripts/llvm.sh 18
          # gcc-13 libstdc++ headers: 22.04's gcc-12 libstdc++ misses some
          # transitive includes the core relies on (e.g. <algorithm>); clang-18
          # auto-selects the newest GCC, matching what works on ubuntu-24.04.
          for attempt in 1 2 3; do
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && break
            echo "add-apt-repository failed (attempt $attempt), retrying…"
            sleep 20
          done
          sudo apt-get update
          sudo apt-get install -y g++-13
          # ninja and the X/GL libs Qt's platform plugin needs so linuxdeploy
          # can find and bundle them into the .deb.
          sudo apt-get install -y ninja-build libfuse2 libbsd-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb1-dev libx11-dev libx11-xcb-dev # QHotkey builds against xcb/X11
          pip install -r upstream/requirements.txt
          pip install "conan==${CONAN_VER}"

      # ---------------------------------------------------------------- macOS
      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          # Target macOS 11 (Big Sur, first Apple-Silicon release) for broad
          # compatibility. Set early so conan-built deps and the app share it.
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          # The runner ships preinstalled aws/azure taps that Homebrew now warns
          # are "not trusted"; we don't use them, so drop them to silence it.
          brew untap aws/tap azure/bicep 2>/dev/null || true
          # ninja is preinstalled on the macOS runner; only install if missing.
          brew list ninja >/dev/null 2>&1 || brew install ninja
          pip install -r upstream/requirements.txt
          pip install "conan==${CONAN_VER}"

      # -------------------------------------------------------------- Windows
      - name: Set up MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # Qt via aqt for all platforms: Linux (gcc_64), macOS (universal clang_64),
      # Windows (MSVC). Keeps the Qt version consistent and lets the Linux
      # .deb bundle a modern Qt regardless of the distro.
      - name: Install Qt (aqt)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.*'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ninja is preinstalled on windows-latest; installing it again warns.
          # The Chocolatey community feed intermittently returns invalid XML and a
          # package (notably nsis) fails to resolve. That used to slip through and
          # only blow up 7 minutes later at the packaging step, so retry the
          # install and verify makensis.exe is actually present before continuing.
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          for ($i = 1; $i -le 3; $i++) {
              choco install -y --no-progress strawberryperl nasm nsis
              if (Test-Path $nsis) { break }
              Write-Host "NSIS not present after attempt $i — retrying in 20s…"
              Start-Sleep -Seconds 20
          }
          if (-not (Test-Path $nsis)) { throw "NSIS failed to install via Chocolatey after 3 attempts" }
          pip install -r upstream/requirements.txt
          pip install "conan==$env:CONAN_VER"

      # ------------------------------------------------------------- Caching
      - name: ccache
        if: matrix.platform != 'windows'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          # Key includes the runner OS so deps/objects built against one glibc
          # are never reused on another (e.g. ubuntu-24.04 -> ubuntu-22.04).
          key: ${{ matrix.os }}-${{ matrix.artifact }}-ccache

      - name: Conan cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.conan2
          key: ${{ matrix.os }}-${{ matrix.artifact }}-conan2-${{ hashFiles('upstream/conanfile.py') }}
          restore-keys: ${{ matrix.os }}-${{ matrix.artifact }}-conan2-

      - name: Patch bootstrap for Windows (run .sh via sh)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -eux
          sed -i 's/subprocess\.run(\[os\.path\.join(/subprocess.run(["sh", os.path.join(/g' \
            upstream/scripts/bootstrap_conan_deps.py

      - name: Bootstrap conan dependencies
        working-directory: upstream
        shell: bash
        run: ./scripts/bootstrap_conan_deps.py

      # Upstream needs a newer boringssl recipe revision than its pinned NLC
      # carries (see the script header).
      - name: Export patched boringssl recipe
        shell: bash
        run: bash client/scripts/export-patched-boringssl.sh

      # The upstream bootstrap now exports the exact dns-libs version pinned in
      # conanfile.py (it reads the pin and checks out the matching revision), so
      # the old re-export workaround for tag drift is gone.
      - name: Prepare conan profile
        shell: bash
        run: |
          set -eux
          conan profile detect --force

      # Stretch conan's conf-driven download retries (defaults: 2 attempts,
      # 5 s apart). NOTE: recipes that pass explicit retry args — the boringssl
      # one does — ignore this conf; those are covered by the retry loops
      # around the configure steps below.
      - name: Harden conan downloads against 503 bursts
        shell: bash
        run: |
          set -eux
          CONAN_HOME_DIR="$(conan config home)"
          mkdir -p "$CONAN_HOME_DIR"
          touch "$CONAN_HOME_DIR/global.conf"
          grep -q "core.download:retry " "$CONAN_HOME_DIR/global.conf" \
            || echo "core.download:retry = 8" >> "$CONAN_HOME_DIR/global.conf"
          grep -q "core.download:retry_wait" "$CONAN_HOME_DIR/global.conf" \
            || echo "core.download:retry_wait = 30" >> "$CONAN_HOME_DIR/global.conf"
          # Checksum-keyed download cache inside ~/.conan2, so the actions/cache
          # step persists it: after ONE successful boringssl download per matrix
          # arm, source() never hits googlesource.com again (works even for
          # recipes with hardcoded retry args). Skipped on Windows — the bash
          # $HOME path isn't valid for the native conan there.
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            grep -q "core.download:download_cache" "$CONAN_HOME_DIR/global.conf" \
              || echo "core.download:download_cache = $CONAN_HOME_DIR/download-cache" \
                   >> "$CONAN_HOME_DIR/global.conf"
          fi
          conan config show "core.download:retry"
          conan config show "core.download:retry_wait"

      # ----------------------------------------------------------- Configure
      - name: Configure (Linux)
        if: matrix.platform == 'linux'
        run: |
          # clang-18 from llvm.sh (upstream is clang-only; gcc trips -Werror=extra)
          # with libstdc++; Qt comes from aqt ($QT_ROOT_DIR).
          # Retried: the conan install inside configure downloads boringssl from
          # googlesource.com, whose 503 bursts outlast the recipe's own retries.
          for attempt in 1 2 3; do
            cmake -S upstream -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DIPV6_UNAVAILABLE=ON -DDISABLE_HTTP3=OFF \
              -DBUILD_TRUSTTUNNEL_QT=ON \
              -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
              -DCMAKE_EXE_LINKER_FLAGS="-Wl,--copy-dt-needed-entries" && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "configure attempt $attempt failed — retrying in 90 s"
            sleep 90
          done

      # macOS configures/builds both arches in the universal step below.

      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # Retried: see the Linux configure comment (boringssl 503 bursts).
          $ok = $false
          foreach ($attempt in 1..3) {
            cmake -S upstream -B build -G Ninja `
              -DCMAKE_BUILD_TYPE=RelWithDebInfo `
              -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
              -DIPV6_UNAVAILABLE=ON -DDISABLE_HTTP3=OFF `
              -DBUILD_TRUSTTUNNEL_QT=ON `
              -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($attempt -lt 3) {
              Write-Host "configure attempt $attempt failed - retrying in 90 s"
              Start-Sleep -Seconds 90
            }
          }
          if (-not $ok) { exit 1 }

      # --------------------------------------------------------------- Build
      - name: Build
        if: matrix.platform != 'macos'
        run: cmake --build build --target FreeTunnel --config RelWithDebInfo -j 4

      - name: Compute version
        id: ver
        shell: bash
        run: |
          set -eu
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # The tag names the artifacts and the installer, but the binary
            # reports CMake's project(VERSION ...). If they drift, every shipped
            # client keeps seeing its own release as an available update.
            project_version="$(sed -nE 's/^project\(FreeTunnel VERSION ([0-9.]+).*/\1/p' client/CMakeLists.txt)"
            if [[ "$version" != "$project_version" ]]; then
              echo "Tag v$version does not match project(FreeTunnel VERSION $project_version)" >&2
              echo "Bump CMakeLists.txt before tagging." >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------- Package
      - name: Prepare Linux bundle
        if: matrix.platform == 'linux'
        run: |
          set -eux
          mkdir -p out
          export ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 QMAKE="$QT_ROOT_DIR/bin/qmake"
          export QML_SOURCES_PATHS="$PWD/client/qml"
          ld=linuxdeploy-x86_64.AppImage
          ldqt=linuxdeploy-plugin-qt-x86_64.AppImage
          # Mirrored in this repo's own build-tools release: linuxdeploy publishes
          # only a "continuous" release that is rewritten in place, so upstream had
          # no immutable reference to pin and every rebuild broke the digest. These
          # tools pick the libraries, AppRun and Qt plugins that go into the
          # published .deb/.AppImage, so what they are must be a deliberate choice.
          # The digest is still verified — a corrupted mirror fails the build too.
          # Not vendored the way scripts/llvm.sh is: these are 31 MB of binary
          # that every clone would carry forever, and a release asset is the one
          # place they can sit immutably without weighing down the repository.
          #
          # Published as a PRE-release so it is never shown as the latest one —
          # it used to be, which pointed the repo sidebar at build tooling instead
          # of the installers. A draft would hide it from the releases page
          # entirely, but drafts are invisible to a contents:read token and this
          # job must not hold a write-capable one: it is the job that runs the
          # third-party tooling below.
          # To refresh: download upstream, review, upload under a new
          # build-tools-<date> tag, update the URLs and digests here.
          tools=https://github.com/${{ github.repository }}/releases/download/build-tools-2026-08-02
          curl -fsSL -o "$ld" "$tools/$ld"
          curl -fsSL -o "$ldqt" "$tools/$ldqt"
          echo "421ca71d5c69ea97c6309276232990d43df1dcece0edfaa26bbf926ff96ed12e  $ld"   | sha256sum -c - \
            || { echo "::error::$ld does not match its pinned digest"; exit 1; }
          echo "be1b7e166bf9975cfb694ebe6759ba40502ffc6196440d3e64aa90c4dbd67e9f  $ldqt" | sha256sum -c - \
            || { echo "::error::$ldqt does not match its pinned digest"; exit 1; }
          chmod +x "$ld" "$ldqt"
          rm -rf AppDir && mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/FreeTunnel/FreeTunnel AppDir/usr/bin/
          cp client/assets/logo-256.png AppDir/usr/share/icons/hicolor/256x256/apps/freetunnel.png
          printf '%s\n' \
            '[Desktop Entry]' 'Type=Application' 'Name=FreeTunnel' \
            'Exec=FreeTunnel %u' 'Icon=freetunnel' 'Categories=Network;' 'Terminal=false' \
            'MimeType=x-scheme-handler/freetunnel;x-scheme-handler/tt;' \
            > AppDir/usr/share/applications/freetunnel.desktop
          PATH="$PWD:$PATH" ./"$ld" --appdir AppDir --plugin qt \
            --desktop-file AppDir/usr/share/applications/freetunnel.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/freetunnel.png \
            --library "$(g++-13 -print-file-name=libstdc++.so.6)" \
            --library "$(g++-13 -print-file-name=libgcc_s.so.1)"

      # .deb for Debian/Ubuntu/Pop!_OS. Self-contained: ships the bundled
      # runtime (binary + Qt libs/plugins/qml) from linuxdeploy's AppDir under
      # /opt/freetunnel. A /usr/bin symlink + .desktop entry integrate it into
      # the launcher; the privileged VPN helper runs via pkexec (polkit).
      - name: Package .deb (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -eux
          if [ ! -x AppDir/usr/bin/FreeTunnel ]; then
            echo "::error::AppDir missing — cannot build .deb"
            exit 1
          fi
          ver="${{ steps.ver.outputs.version }}"
          root=debpkg
          rm -rf "$root"
          mkdir -p "$root/opt/freetunnel" "$root/usr/bin" \
                   "$root/usr/share/applications" \
                   "$root/usr/share/pixmaps" \
                   "$root/usr/share/icons/hicolor/256x256/apps" \
                   "$root/DEBIAN"
          # Bundled runtime (binary + Qt libs/plugins/qml + qt.conf).
          cp -a AppDir/usr/. "$root/opt/freetunnel/"
          # Launcher on PATH (rpath is $ORIGIN/../lib, so the symlink works).
          ln -sf /opt/freetunnel/bin/FreeTunnel "$root/usr/bin/freetunnel"
          # Menu entry + icons (multiple sizes for launchers / software centers).
          for s in 48 128 256 512; do
            mkdir -p "$root/usr/share/icons/hicolor/${s}x${s}/apps"
            cp "client/assets/logo-${s}.png" \
              "$root/usr/share/icons/hicolor/${s}x${s}/apps/freetunnel.png"
          done
          cp client/assets/logo-256.png \
            "$root/usr/share/pixmaps/freetunnel.png"
          printf '%s\n' \
            '[Desktop Entry]' 'Type=Application' 'Name=FreeTunnel' \
            'Exec=freetunnel %u' 'Icon=freetunnel' 'Categories=Network;' 'Terminal=false' \
            'MimeType=x-scheme-handler/freetunnel;x-scheme-handler/tt;' \
            > "$root/usr/share/applications/freetunnel.desktop"
          installed_kb=$(du -sk "$root" | cut -f1)
          # The floor comes from the binary we just built, not from a number typed
          # here: an unversioned libc6 let the package install on a distro too old
          # to run it, and the failure then looks like a broken app rather than an
          # unmet dependency. objdump lists the versioned glibc symbols the
          # executable actually references; the highest one is the real minimum.
          # Everything we ship, not just the executable: the bundled Qt libraries
          # link glibc too, and the package is only installable where the highest
          # requirement among them is met.
          glibc_dep="$(find "$root/opt/freetunnel" -type f \( -name 'FreeTunnel' -o -name '*.so*' \) \
            -exec objdump -T {} + 2>/dev/null \
            | sed -nE 's/.*GLIBC_([0-9]+\.[0-9]+).*/\1/p' \
            | sort -V | tail -1)"
          : "${glibc_dep:?could not determine the glibc version the payload needs}"
          echo "glibc floor: $glibc_dep"
          cat > "$root/DEBIAN/control" <<EOF
          Package: freetunnel
          Version: ${ver}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: FreeTunnel <noreply@freetunnel.app>
          Installed-Size: ${installed_kb}
          Depends: libc6 (>= ${glibc_dep}), libgl1, libxkbcommon0, libxcb-cursor0, policykit-1 | polkit
          Description: FreeTunnel VPN client
           A simple, modern desktop client for the TrustTunnel VPN core.
           Bundles its own Qt runtime; the privileged VPN helper is started on
           demand via pkexec (polkit).
          EOF
          cat > "$root/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          command -v update-desktop-database >/dev/null 2>&1 && \
            update-desktop-database -q /usr/share/applications || true
          command -v gtk-update-icon-cache >/dev/null 2>&1 && \
            gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
          exit 0
          EOF
          chmod 0755 "$root/DEBIAN/postinst"
          dpkg-deb --build --root-owner-group "$root" \
            "out/${{ matrix.artifact }}.deb"
          ls -la out

      # Portable AppImage for distros without .deb integration (Fedora, Arch, etc.).
      - name: Package AppImage (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -eux
          if [ ! -x AppDir/usr/bin/FreeTunnel ]; then
            echo "::error::AppDir missing — cannot build AppImage"
            exit 1
          fi
          ld=linuxdeploy-x86_64.AppImage
          PATH="$PWD:$PATH" ./"$ld" --appdir AppDir --output appimage
          appimage=$(ls -1 *.AppImage | head -1)
          mv "$appimage" "out/${{ matrix.artifact }}.AppImage"
          ls -la out

      - name: Build & package universal (macOS)
        if: matrix.platform == 'macos'
        run: |
          set -eux
          common=(-S upstream -G Ninja
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            -DIPV6_UNAVAILABLE=ON -DDISABLE_HTTP3=OFF
            -DBUILD_TRUSTTUNNEL_QT=ON
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR")

          # The core deps include quiche (Rust); cross-building the x86_64 slice
          # needs that Rust target installed (the runner only has the native one).
          rustup target add x86_64-apple-darwin

          # Configure is retried: see the Linux configure comment (boringssl
          # 503 bursts on googlesource.com). Builds themselves are not retried.
          retry_configure() {
            for attempt in 1 2 3; do
              if cmake "$@"; then return 0; fi
              if [ "$attempt" = 3 ]; then return 1; fi
              echo "configure attempt $attempt failed — retrying in 90 s"
              sleep 90
            done
          }

          # arm64 (native) and x86_64 (cross-compiled by Apple clang).
          retry_configure "${common[@]}" -B build-arm64 -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build-arm64 --target FreeTunnel -j3
          retry_configure "${common[@]}" -B build-x64 -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build-x64 --target FreeTunnel -j3

          # Merge the two slices into a universal binary inside the arm64 bundle.
          APP=build-arm64/FreeTunnel/FreeTunnel.app
          lipo -create \
            build-arm64/FreeTunnel/FreeTunnel.app/Contents/MacOS/FreeTunnel \
            build-x64/FreeTunnel/FreeTunnel.app/Contents/MacOS/FreeTunnel \
            -output "$APP/Contents/MacOS/FreeTunnel"
          lipo -info "$APP/Contents/MacOS/FreeTunnel"

          # macdeployqt aborts (exit 16) trying to deploy Qt's SQL driver plugins,
          # which link Homebrew libs (libpq/libiodbc/libmimerapi) that aren't on the
          # runner image. The app uses no SQL, so drop those plugins first.
          rm -rf "$QT_ROOT_DIR/plugins/sqldrivers"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -always-overwrite -qmldir=client/qml
          cp client/assets/logo.icns "$APP/Contents/Resources/logo.icns"
          # Ad-hoc sign so the bundle launches once the user approves it in
          # Gatekeeper (no Developer ID available for full signing/notarization).
          # NOT "|| true": an unsigned bundle is refused outright by macOS on
          # Apple Silicon, and swallowing the failure ships a DMG that simply
          # cannot launch — discovered only by users.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p out
          RW=out/rw.dmg
          # "Resource busy" here is transient and it has failed a build: the .app
          # was written seconds ago and Spotlight/fseventsd can still be walking
          # it, and a /Volumes/FreeTunnel left attached by an earlier attempt
          # holds the volume name. Clean up and retry — the detach below already
          # does the same thing for the same reason, and a release build should
          # not die on this.
          for attempt in 1 2 3 4 5; do
            hdiutil detach /Volumes/FreeTunnel -force >/dev/null 2>&1 || true
            if hdiutil create -volname "FreeTunnel" -srcfolder "$APP" -size 200m \
                 -ov -format UDRW "$RW"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::hdiutil create failed five times — not a transient"
              exit 1
            fi
            echo "hdiutil create failed (attempt $attempt) — retrying in 15 s"
            sleep 15
          done
          MOUNT=$(hdiutil attach -readwrite -noverify -noautofsck "$RW" | awk '/\/Volumes\// {print $NF; exit}')
          cp client/assets/logo.icns "$MOUNT/.VolumeIcon.icns"
          SetFile -a C "$MOUNT/.VolumeIcon.icns"
          ln -sf /Applications "$MOUNT/Applications"
          bless --folder "$MOUNT" --openfolder "$MOUNT" --icon "$MOUNT/.VolumeIcon.icns" || true
          # Spotlight/fseventsd can hold the volume briefly — retry the detach.
          for i in 1 2 3 4 5; do
            if hdiutil detach "$MOUNT"; then break; fi
            if [ "$i" = 5 ]; then hdiutil detach "$MOUNT" -force; fi
            sleep 5
          done
          hdiutil convert "$RW" -format UDZO -imagekey zlib-level=9 -o out/${{ matrix.artifact }}.dmg
          rm -f "$RW"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "build\FreeTunnel"
          $exe = Get-ChildItem -Path $bin -Recurse -Filter FreeTunnel.exe | Select-Object -First 1
          $deploy = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          New-Item -ItemType Directory -Force -Path dist, out | Out-Null
          Copy-Item $exe.FullName dist\
          if (Test-Path "$bin\assets") { Copy-Item "$bin\assets" dist\assets -Recurse }
          New-Item -ItemType Directory -Force -Path dist\assets | Out-Null
          Copy-Item client\assets\logo.ico dist\assets\ -Force
          Copy-Item client\assets\logo.png dist\assets\ -Force -ErrorAction SilentlyContinue
          & $deploy --release --no-translations --qmldir client\qml dist\FreeTunnel.exe

          # Bundle the MSVC runtime (MSVCP140.dll, VCRUNTIME140*.dll) so the app
          # launches on a clean Windows without a separately installed VC++
          # Redistributable. windeployqt --compiler-runtime doesn't locate it under
          # the VS18 layout, so copy the CRT redist DLLs from VCToolsRedistDir.
          $crt = Get-ChildItem -Path (Join-Path $env:VCToolsRedistDir "x64") -Directory `
                   -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if (-not $crt) { throw "VC++ CRT redist not found under '$env:VCToolsRedistDir'" }
          Copy-Item (Join-Path $crt.FullName "*.dll") dist\ -Force
          if (-not (Test-Path "dist\MSVCP140.dll")) { throw "VC++ runtime (MSVCP140.dll) was not bundled" }

          # Bundle Wintun: the VPN core creates its tunnel adapter via wintun.dll
          # (loaded at runtime). Without it the core fails with "Failed to create
          # listener" even when elevated. Pin the official release and verify it.
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          $wtHash = (Get-FileHash wintun.zip -Algorithm SHA256).Hash
          if ($wtHash -ne "07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51") {
              throw "Wintun checksum mismatch: $wtHash"
          }
          Expand-Archive -Path wintun.zip -DestinationPath wintun_extract -Force
          Copy-Item "wintun_extract\wintun\bin\amd64\wintun.dll" dist\ -Force
          if (-not (Test-Path "dist\wintun.dll")) { throw "wintun.dll was not bundled" }

          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { throw "NSIS not found at $nsis" }
          $distAbs = (Resolve-Path dist).Path
          & $nsis "/DBUILD_DIR=$distAbs" "/DPRODUCT_VERSION=${{ steps.ver.outputs.version }}" client\win\installer.nsi
          $setup = Get-ChildItem -Path "client\win" -Filter "FreeTunnel-*-Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS did not produce FreeTunnel-*-Setup.exe" }
          Move-Item $setup.FullName "out\${{ matrix.artifact }}-Setup.exe" -Force
          ls out

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # First: actions/checkout cleans the workspace, so it has to run before the
      # artifacts land in it. Full history + tags — the notes come from
      # CHANGELOG.md and the compare link needs the previous tag.
      - name: Check out the changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: freetunnel-*
          merge-multiple: true

      # Publish SHA256 checksums so users can verify the (unsigned) downloads.
      # Names match the release asset names (basenames), which is what GitHub
      # exposes once the nested artifact folders are flattened.
      - name: Generate checksums
        run: |
          set -eux
          cd artifacts
          # The signature covers this file, so whatever is in it is what the
          # signature attests to. Asset names carry no version — every release
          # calls its installer freetunnel-linux-x86_64.deb — so without this line
          # the signed bytes say "we built these" and nothing about WHICH release
          # they came from, and an older release's manifest and signature verify
          # perfectly when replayed. See docs/security-threats.md.
          #
          # Two things decide the exact spelling.
          #
          # It starts with '#', because people verify this file by hand with
          # `sha256sum -c SHA256SUMS.txt`, and coreutils reports any line it
          # cannot parse as "improperly formatted" — a warning that reads like
          # tampering, and an outright failure under --strict. It tolerates
          # comment lines.
          #
          # And it carries no space, so it stays a single field: the manifest
          # parser shipped in existing clients skips lines with fewer than two
          # fields, which makes this invisible to them rather than something they
          # mistake for an asset name.
          echo "#version=${GITHUB_REF_NAME#v}" > SHA256SUMS.txt
          find . -type f \( -name '*.deb' -o -name '*.dmg' -o -name '*-Setup.exe' -o -name '*.AppImage' \) \
            -exec sha256sum {} + \
            | awk '{ n=$2; sub(/.*\//,"",n); print $1"  "n }' \
            | sort -k2 >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Sign the manifest with the Ed25519 release key so the in-app updater can
      # verify it against the public key compiled into the binary.
      # Set the ED25519_SIGNING_KEY repo secret to a PEM private key to enable.
      - name: Sign checksums
        env:
          ED25519_SIGNING_KEY: ${{ secrets.ED25519_SIGNING_KEY }}
        run: |
          # NOTE: no -x here. Tracing this step would echo the raw private key
          # into the job log, where only GitHub's best-effort masking stands
          # between it and anyone who can read the run.
          set -eu
          if [ -z "${ED25519_SIGNING_KEY:-}" ]; then
            # Every shipped binary has the public key compiled in and the updater
            # refuses an unsigned release, so publishing one would strand all
            # installed clients. Fail the tag build instead.
            echo "ED25519_SIGNING_KEY is not configured — refusing to publish an" >&2
            echo "unsigned release: deployed clients would reject it as an update." >&2
            exit 1
          fi
          cd artifacts
          # umask before the redirect, not chmod after: the shell creates the file
          # with the ambient mode first, so a chmod afterwards leaves a window in
          # which the release signing key is readable by anything else on the
          # runner. It is removed below either way, but not before it is used.
          (umask 077; printf '%s' "$ED25519_SIGNING_KEY" > ed25519.pem)
          openssl pkeyutl -sign -inkey ed25519.pem -rawin -in SHA256SUMS.txt -out SHA256SUMS.txt.sig
          rm -f ed25519.pem
          ls -la SHA256SUMS.txt.sig

      # What changed comes from CHANGELOG.md, so every release says something
      # about ITSELF. The install notes are the part that is identical every
      # time, and they are appended AFTER the real notes — never instead of
      # them. A tag with no matching section fails here rather than publishing
      # yet another release whose description tells the user nothing.
      - name: Assemble release notes
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## $version" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' notes.md
          if [ ! -s notes.md ]; then
            echo "::error title=No release notes::CHANGELOG.md has no '## $version' section. Write what changed for users before tagging."
            exit 1
          fi
          # --match: the nearest tag is not necessarily the previous RELEASE —
          # the build-tools mirror tag sits on the same history and was picked
          # first for 1.1.7, pointing the compare link at build tooling.
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' \
                    "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo
            echo "### Installing"
            echo
            echo "- **Linux**: install the **.deb** on Debian/Ubuntu/Pop!_OS"
            echo "  (\`sudo apt install ./freetunnel-linux-x86_64.deb\`) — it bundles its own Qt"
            echo "  and appears in the app menu. Or run the portable **AppImage**"
            echo "  (\`chmod +x freetunnel-linux-x86_64.AppImage && ./freetunnel-linux-x86_64.AppImage\`)."
            echo "- **macOS**: open the **.dmg** and drag FreeTunnel to Applications. The app is"
            echo "  ad-hoc signed but not notarized, so on first launch right-click it → Open"
            echo "  (or run \`xattr -dr com.apple.quarantine /Applications/FreeTunnel.app\`)."
            echo "- **Windows**: run the **Setup.exe**. SmartScreen may warn — choose"
            echo "  \"More info\" → \"Run anyway\"."
            echo
            echo "Verify your download against \`SHA256SUMS.txt\` (signed as \`SHA256SUMS.txt.sig\`)."
            if [ -n "$prev" ]; then
              echo
              echo "**Every commit in this release**: ${{ github.server_url }}/${{ github.repository }}/compare/$prev...${GITHUB_REF_NAME}"
            fi
          } >> notes.md
          echo "--- release body ---"
          cat notes.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/*-Setup.exe
            artifacts/**/*.AppImage
            artifacts/SHA256SUMS.txt
            artifacts/SHA256SUMS.txt.sig
          body_path: notes.md
