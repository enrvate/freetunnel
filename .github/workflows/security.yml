name: Security

# Static analysis and dependency hygiene. Keeps feedback fast — no VPN core build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # This repository goes quiet for weeks at a time. Without a scheduled run the
  # first CI after a gap mixes two different things: what the new commit broke,
  # and what drifted underneath it while nothing was pushed — a newer cppcheck
  # or clang-tidy in the runner image, or the pinned upstream ref going away.
  # A weekly run on main separates them, so a red build after a quiet spell is
  # about the commit and nothing else.
  schedule:
    - cron: '23 5 * * 1' # Mondays, 05:23 UTC

concurrency:
  # The event is part of the group so a push cannot cancel the scheduled run
  # that exists precisely to sample a quiet main.
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least privilege by default: no job needs to write to the repo except the
# release job, which asks for contents: write explicitly. Without this the
# repo/org default applies, handing a write-capable token to every job —
# including the ones that execute third-party tooling.
permissions:
  contents: read

jobs:
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          set -eux
          cppcheck --error-exitcode=1 \
            --enable=warning,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unknownMacro \
            --suppress=passedByValue \
            --suppress=sizeofwithnumericparameter \
            --inline-suppr \
            --library=qt \
            -I include -I include/app -I include/core -I include/vpn \
            include src

  pinned-deps:
    name: pinned dependency refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify pinned upstream and FetchContent tags
        run: bash scripts/check-pinned-deps.sh

  dependency-review:
    permissions:
      contents: read
      pull-requests: read
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy libssl-dev libsecret-1-dev pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Run clang-tidy
        run: bash scripts/run-clang-tidy.sh build-tidy

  upstream-patch:
    name: upstream patch verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify telemetry patch applies to pinned upstream
        run: bash scripts/verify_upstream_patch.sh

  i18n:
    name: i18n catalog freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Qt linguist tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-l10n-tools
          # Debian/Ubuntu ship lupdate under /usr/lib/qt6/bin — put it on PATH.
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - name: Verify translation catalog is up to date
        run: bash scripts/i18n-verify.sh

  codeql:
    name: CodeQL
    # Deliberately NOT a required check on main. This is a triage feed into the
    # Security tab, not a gate: its findings need a human to judge, and a gate
    # that reports things nobody will fix is how the old clang-tidy config became
    # decorative (see .clang-tidy for that story).
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # build-mode: none, and that choice is the whole reason this job is cheap
      # enough to exist. FreeTunnel does not build standalone: a traced build
      # needs the upstream TrustTunnel checkout, the stats patch, conan, a Rust
      # toolchain for quiche and Qt from aqt — eleven minutes before the first
      # line of our own code compiles. It would also extract the entire upstream
      # core and its vendored TLS stack, burying our ~13k lines in alerts about
      # code this project cannot fix.
      #
      # The trade-off is real and worth stating: without a build CodeQL cannot
      # resolve Qt's headers or see moc-generated code, so its dataflow is
      # weaker than a traced run. What is left still crosses function boundaries,
      # which is more than cppcheck or our curated clang-tidy list attempt.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: c-cpp
          build-mode: none
          # Only our own sources. paths/paths-ignore are honoured for C/C++ only
          # when build-mode is none, which is the mode we are in.
          config: |
            paths:
              - src
              - include
              - main.cpp

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:c-cpp
