name: Tests

# Fast, core-independent unit tests (Qt only — no conan/VPN core), so they give
# quick feedback on every push/PR without the heavy native build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run on a quiet main, for two reasons. The same runner-image drift the
  # Security workflow watches for, and the Windows unit-test intermittency that
  # has never been reproduced on demand: a scheduled run samples it on a cadence,
  # so the next time it shows up there is a history to compare against instead of
  # one mystery failure with nothing around it.
  schedule:
    - cron: '41 5 * * 1' # Mondays, 05:41 UTC

concurrency:
  # The event is part of the group so a push cannot cancel the scheduled run
  # that exists precisely to sample a quiet main.
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Kept identical across workflows; scripts/check-pinned-deps.sh enforces that.
  QT_VER: '6.8.*'
  # Exact pin, same as build.yml: conan drives every native dependency fetch.
  CONAN_VER: '2.31.1'

# Least privilege by default: no job needs to write to the repo except the
# release job, which asks for contents: write explicitly. Without this the
# repo/org default applies, handing a write-capable token to every job —
# including the ones that execute third-party tooling.
permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev libsecret-1-dev pkg-config \
            dbus-x11 gnome-keyring

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: ${{ env.QT_VER }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list qt >/dev/null 2>&1 || brew install qt
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: ${{ env.QT_VER }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S tests -B build-tests -G Ninja

      - name: Build
        run: cmake --build build-tests -j

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run-ctest.sh build-tests

  coverage:
    name: Coverage (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev libsecret-1-dev pkg-config lcov \
            libfuse2 libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 git python3-pip \
            dbus-x11 gnome-keyring
          # Vendored, not fetched: this runs as root. See scripts/llvm.sh.
          sudo bash scripts/llvm.sh 18
          sudo apt-get install -y g++-13
          pip install "conan==${CONAN_VER}"

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: ${{ env.QT_VER }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Build, test, and report coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/coverage-upstream-report.sh build-coverage coverage-out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage-out/
          if-no-files-found: error

      - name: Upload coverage to Codacy
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -z "${CODACY_PROJECT_TOKEN:-}" ]; then
            echo "::notice title=Codacy coverage::CODACY_PROJECT_TOKEN is not set — coverage stays at 0% on Codacy."
            exit 0
          fi
          # Must be the *Coverage* project token (Settings → Coverage), not Account → API tokens.
          #
          # The reporter is pinned and verified rather than piped from
          # coverage.codacy.com: that script runs with the project token in the
          # environment, so a compromise of that host would both exfiltrate the
          # token and execute arbitrary code in a runner that has the repo
          # checked out. Bump by changing the version and the digest together.
          reporter_version=14.1.3
          curl -fsSL -o codacy-reporter \
            "https://github.com/codacy/codacy-coverage-reporter/releases/download/${reporter_version}/codacy-coverage-reporter-linux"
          echo "15c5f052207d27b8501ab5d5910c68c206ea70b0157ee1725132780530580875  codacy-reporter" \
            | sha256sum -c -
          chmod +x codacy-reporter
          ./codacy-reporter report \
            --project-token "${CODACY_PROJECT_TOKEN}" \
            -r coverage-out/coverage.filtered.info \
            -l Cpp \
            --commit-uuid "${GITHUB_SHA}" \
            || {
              echo "::warning title=Codacy coverage upload failed::Use the Project API token from Codacy → freetunnel → Settings → Coverage (not Account → API tokens). See CONTRIBUTING.md."
              exit 1
            }

  sanitizers:
    name: ASan+UBSan (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev libsecret-1-dev pkg-config \
            dbus-x11 gnome-keyring

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: ${{ env.QT_VER }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: cmake -S tests -B build-asan -G Ninja -DFT_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-asan -j

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0:allocator_may_return_null=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: bash scripts/run-ctest.sh build-asan
