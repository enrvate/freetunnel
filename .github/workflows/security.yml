name: Security

# Static analysis and dependency hygiene. Keeps feedback fast — no VPN core build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # This repository goes quiet for weeks at a time. Without a scheduled run the
  # first CI after a gap mixes two different things: what the new commit broke,
  # and what drifted underneath it while nothing was pushed — a newer cppcheck
  # or clang-tidy in the runner image, or the pinned upstream ref going away.
  # A weekly run on main separates them, so a red build after a quiet spell is
  # about the commit and nothing else.
  schedule:
    - cron: '23 5 * * 1' # Mondays, 05:23 UTC

concurrency:
  # The event is part of the group so a push cannot cancel the scheduled run
  # that exists precisely to sample a quiet main.
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Kept identical across workflows; scripts/check-pinned-deps.sh enforces that.
  QT_VER: '6.8.*'

# Least privilege by default: no job needs to write to the repo except the
# release job, which asks for contents: write explicitly. Without this the
# repo/org default applies, handing a write-capable token to every job —
# including the ones that execute third-party tooling.
permissions:
  contents: read

jobs:
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          set -eux
          # Suppressions come from the file, not from this list: they are also
          # needed by Codacy (which cannot read the file) and by anyone running
          # cppcheck locally. One copy here is one copy that can go stale.
          cppcheck --error-exitcode=1 \
            --enable=warning,performance,portability \
            --suppressions-list=cppcheck-suppressions.txt \
            --inline-suppr \
            --library=qt \
            -I include -I include/app -I include/core -I include/vpn \
            include src

      - name: Codacy suppressions match the list
        run: |
          set -eu
          # Codacy takes cppcheck flags only from .codacy.yml (engines.cppcheck.
          # extra_lines), so that copy is unavoidable. What is avoidable is the
          # two drifting apart and analysis disagreeing with CI for months.
          missing=0
          while read -r id; do
            case "$id" in ''|\#*) continue ;; esac
            grep -q -- "--suppress=$id\"" .codacy.yml || { echo "::error::$id is suppressed for CI but not in .codacy.yml"; missing=1; }
          done < cppcheck-suppressions.txt
          [ "$missing" -eq 0 ]

  pinned-deps:
    name: pinned dependency refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify pinned upstream and FetchContent tags
        run: bash scripts/check-pinned-deps.sh

  dependency-review:
    permissions:
      contents: read
      pull-requests: read
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy libssl-dev libsecret-1-dev pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: ${{ env.QT_VER }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Run clang-tidy
        run: bash scripts/run-clang-tidy.sh build-tidy

  upstream-patch:
    name: upstream patch verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify telemetry patch applies to pinned upstream
        run: bash scripts/verify_upstream_patch.sh

  i18n:
    name: i18n catalog freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Qt linguist tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-l10n-tools
          # Debian/Ubuntu ship lupdate under /usr/lib/qt6/bin — put it on PATH.
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - name: Verify translation catalog is up to date
        run: bash scripts/i18n-verify.sh
